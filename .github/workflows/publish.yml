name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Registry and auth come from the project .npmrc
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` triggers the `prepare` script, which builds dist/
      - run: npm ci
      - run: npm run typecheck
      - run: npm publish
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
